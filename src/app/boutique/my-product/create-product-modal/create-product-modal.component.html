<app-modal-forms
  [isOpen]="isOpen"
  [title]="title"
  (close)="emitClose()">
  <form [formGroup]="productForm" (ngSubmit)="emitSubmit()">
      <div class="form-grid">
          <label>
              Name
              <span class="field-error" *ngIf="productForm.get('name')?.hasError('required')">Name is required</span>
              <input type="text" formControlName="name" placeholder="Tomates cerises" />
          </label>
          <label>
              Price (Ar)
              <span class="field-error" *ngIf="productForm.get('price')?.hasError('required')">Price is required</span>
              <input type="number" formControlName="price" placeholder="2500" min="0" />
          </label>
          <label>
              Product Type
              <span class="field-error" *ngIf="productForm.get('productTypeId')?.hasError('required')">Product type is required</span>
              <select formControlName="productTypeId" (change)="emitProductTypeChange($any($event.target).value)">
                  <option value="">Select a product type</option>
                  <option *ngFor="let pt of productTypes" [value]="pt.id">{{ pt.label }}</option>
              </select>
          </label>
          <label>
              Status
              <select formControlName="status">
                  <option *ngFor="let s of statusOptions" [value]="s">{{ s }}</option>
              </select>
          </label>
      </div>

      <div class="attributes-section" *ngIf="selectedProductType && selectedProductType.attributes && selectedProductType.attributes.length > 0">
          <h3>Product Attributes</h3>

          <div class="form-grid" [formGroup]="attributesForm" *ngIf="nonBooleanAttributes.length > 0">
              <ng-container *ngFor="let attr of nonBooleanAttributes">
                  <label *ngIf="attr.type === 'STRING'">
                      {{ attr.code }}
                      <input type="text" [formControlName]="attr.code" [placeholder]="attr.code" />
                  </label>

                  <label *ngIf="attr.type === 'NUMBER'">
                      {{ attr.code }}
                      <input 
                          type="number" 
                          [formControlName]="attr.code" 
                          [placeholder]="attr.code"
                          [min]="attr.min ?? null"
                          [max]="attr.max ?? null" />
                      <small *ngIf="attr.min !== undefined || attr.max !== undefined">
                          (Min: {{ attr.min ?? 'N/A' }}, Max: {{ attr.max ?? 'N/A' }})
                      </small>
                  </label>

                  <label *ngIf="attr.type === 'ENUM'">
                      {{ attr.code }}
                      <select [formControlName]="attr.code">
                          <option value="">Select {{ attr.code }}</option>
                          <option *ngFor="let val of attr.values" [value]="val">{{ val }}</option>
                      </select>
                  </label>

                  <label *ngIf="attr.type === 'DATE'">
                      {{ attr.code }}
                      <input type="date" [formControlName]="attr.code" />
                  </label>

              </ng-container>
          </div>

          <div class="boolean-attributes" [formGroup]="attributesForm" *ngIf="booleanAttributes.length > 0">
              <ng-container *ngFor="let attr of booleanAttributes">
                  <label class="checkbox-label">
                      <input type="checkbox" [formControlName]="attr.code" />
                      <span>{{ attr.code }}</span>
                  </label>
              </ng-container>
          </div>
      </div>

      <div class="form-error" *ngIf="submitError">{{ submitError }}</div>

      <div class="modal-actions">
          <button mat-stroked-button color="primary" type="button" class="ghost" (click)="emitClose()">Cancel</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="productForm.invalid || isSubmitting">
              {{ isSubmitting ? (isEditMode ? 'Updating...' : 'Creating...') : (isEditMode ? 'Update' : 'Create') }}
          </button>
      </div>
  </form>
</app-modal-forms>
