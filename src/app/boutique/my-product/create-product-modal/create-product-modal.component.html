<app-modal-forms
  [isOpen]="isOpen"
  [title]="title"
  (close)="emitClose()">
  <form [formGroup]="productForm" (ngSubmit)="emitSubmit()">
      <div class="form-grid">
          <label>
              Nom
              <span class="field-error" *ngIf="productForm.get('name')?.hasError('required')">Le nom est requis</span>
              <input type="text" formControlName="name" placeholder="Tomates cerises" />
          </label>
          <label>
              Prix (Ar)
              <span class="field-error" *ngIf="productForm.get('price')?.hasError('required')">Le prix est requis</span>
              <input type="number" formControlName="price" placeholder="2500" min="0" />
          </label>
          <label>
              Type de produit
              <span class="field-error" *ngIf="productForm.get('productTypeId')?.hasError('required')">Le type de produit est requis</span>
              <select formControlName="productTypeId" (change)="emitProductTypeChange($any($event.target).value)">
                  <option value="">Sélectionner un type de produit</option>
                  <option *ngFor="let pt of productTypes" [value]="pt.id">{{ pt.label }}</option>
              </select>
          </label>
          <label>
              Statut
              <select formControlName="status">
                  <option *ngFor="let s of statusOptions" [value]="s">{{ s }}</option>
              </select>
          </label>
      </div>

      <div class="image-upload-section">
          <label class="image-upload-label">Image du produit</label>
          
          <div class="image-upload-container" *ngIf="!imagePreview">
              <input 
                  type="file" 
                  #fileInput
                  accept="image/*" 
                  (change)="onImageSelected($event)"
                  style="display: none" />
              <button 
                  mat-stroked-button 
                  type="button" 
                  class="upload-button"
                  (click)="fileInput.click()">
                  <mat-icon>add_photo_alternate</mat-icon>
                  <span>Télécharger une image</span>
              </button>
              <p class="upload-hint">PNG, JPG, WEBP (Max 5 Mo)</p>
          </div>

          <div class="image-preview-container" *ngIf="imagePreview">
              <img [src]="imagePreview" alt="Product preview" class="image-preview" />
              <button 
                  mat-icon-button 
                  type="button" 
                  class="remove-image-button"
                  (click)="removeImage()">
                  <mat-icon>close</mat-icon>
              </button>
          </div>
      </div>

      <div class="attributes-section" *ngIf="selectedProductType && selectedProductType.attributes && selectedProductType.attributes.length > 0">
          <h3>Attributs du produit</h3>

          <div class="form-grid" [formGroup]="attributesForm" *ngIf="nonBooleanAttributes.length > 0">
              <ng-container *ngFor="let attr of nonBooleanAttributes">
                  <label *ngIf="attr.type === 'STRING'">
                      {{ attr.code }}
                      <input type="text" [formControlName]="attr.code" [placeholder]="attr.code" />
                  </label>

                  <label *ngIf="attr.type === 'NUMBER'">
                      {{ attr.code }}
                      <input 
                          type="number" 
                          [formControlName]="attr.code" 
                          [placeholder]="attr.code"
                          [min]="attr.min ?? null"
                          [max]="attr.max ?? null" />
                      <small *ngIf="attr.min !== undefined || attr.max !== undefined">
                          (Min: {{ attr.min ?? 'N/A' }}, Max: {{ attr.max ?? 'N/A' }})
                      </small>
                  </label>

                  <label *ngIf="attr.type === 'ENUM'">
                      {{ attr.code }}
                      <select [formControlName]="attr.code">
                          <option value="">Sélectionner {{ attr.code }}</option>
                          <option *ngFor="let val of attr.values" [value]="val">{{ val }}</option>
                      </select>
                  </label>

                  <label *ngIf="attr.type === 'DATE'">
                      {{ attr.code }}
                      <input type="date" [formControlName]="attr.code" />
                  </label>

              </ng-container>
          </div>

          <div class="boolean-attributes" [formGroup]="attributesForm" *ngIf="booleanAttributes.length > 0">
              <ng-container *ngFor="let attr of booleanAttributes">
                  <label class="checkbox-label">
                      <input type="checkbox" [formControlName]="attr.code" />
                      <span>{{ attr.code }}</span>
                  </label>
              </ng-container>
          </div>
      </div>

      <div class="form-error" *ngIf="submitError">{{ submitError }}</div>

      <div class="modal-actions">
          <button mat-stroked-button color="primary" type="button" class="ghost" (click)="emitClose()">Annuler</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="productForm.invalid || isSubmitting">
              {{ isSubmitting ? (isEditMode ? 'Mise à jour…' : 'Création…') : (isEditMode ? 'Mettre à jour' : 'Créer') }}
          </button>
      </div>
  </form>
</app-modal-forms>
