<app-modal-forms [isOpen]="isOpen" [title]="'Ajouter du stock au produit'" (close)="emitClose()">
  <div class="stock-modal" *ngIf="product">
    <p class="modal-subtitle">Mettez à jour la quantité en stock pour ce produit.</p>

    <div class="product-grid">
      <div class="info-card">
        <p class="label">ID produit</p>
        <p class="value mono">{{ product._id }}</p>

        <p class="label">Nom</p>
        <p class="value">{{ product.name }}</p>
      </div>

      <div class="info-card">
        <p class="label">Stock actuel</p>
        <p class="value stock">{{ product.stock || 0 }} unités</p>

        <p class="label" *ngIf="product.price">Prix</p>
        <p class="value" *ngIf="product.price">{{ product.price | number }} Ar</p>
      </div>
    </div>

    <div class="stock-input">
      <mat-form-field appearance="outline">
        <mat-label>Quantité à ajouter</mat-label>
        <input matInput type="number" [(ngModel)]="quantity" min="1" />
        <mat-hint>Entrez le nombre d'unités à ajouter au stock</mat-hint>
      </mat-form-field>
      <div class="field-error" *ngIf="error">{{ error }}</div>
    </div>

    <div class="modal-actions">
      <button mat-stroked-button color="primary" type="button" (click)="emitClose()" class="ghost">Annuler</button>
      <button mat-raised-button color="primary" type="button" (click)="doAdd()" [disabled]="isSubmitting">
        <span *ngIf="!isSubmitting">Ajouter</span>
        <span *ngIf="isSubmitting">Ajout en cours…</span>
      </button>
    </div>
  </div>
</app-modal-forms>
