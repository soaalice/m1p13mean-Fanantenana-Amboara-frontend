<app-modal-forms [isOpen]="isOpen" [title]="'Add stock to product'" (close)="emitClose()">
  <div class="stock-modal" *ngIf="product">
    <p class="modal-subtitle">Update inventory quantity for this product.</p>

    <div class="product-grid">
      <div class="info-card">
        <p class="label">Product ID</p>
        <p class="value mono">{{ product._id }}</p>

        <p class="label">Name</p>
        <p class="value">{{ product.name }}</p>
      </div>

      <div class="info-card">
        <p class="label">Current stock</p>
        <p class="value stock">{{ product.stock || 0 }} units</p>

        <p class="label" *ngIf="product.price">Price</p>
        <p class="value" *ngIf="product.price">{{ product.price | number }} Ar</p>
      </div>
    </div>

    <div class="stock-input">
      <mat-form-field appearance="outline">
        <mat-label>Quantity to add</mat-label>
        <input matInput type="number" [(ngModel)]="quantity" min="1" />
        <mat-hint>Enter the number of units to add to stock</mat-hint>
      </mat-form-field>
      <div class="field-error" *ngIf="error">{{ error }}</div>
    </div>

    <div class="modal-actions">
      <button mat-stroked-button color="primary" type="button" (click)="emitClose()" class="ghost">Cancel</button>
      <button mat-raised-button color="primary" type="button" (click)="doAdd()" [disabled]="isSubmitting">
        <span *ngIf="!isSubmitting">Add</span>
        <span *ngIf="isSubmitting">Adding...</span>
      </button>
    </div>
  </div>
</app-modal-forms>
