<app-modal-forms
  [isOpen]="isOpen"
  [title]="'Modifier la photo de la boutique'"
  (close)="onClose()">
  
  <div class="update-photo-content">
    <div class="shop-info" *ngIf="shop">
      <h3>{{ shop.name }}</h3>
    </div>

    <div class="current-photo" *ngIf="shop?.photoUrl && !selectedFile">
      <label class="section-label">Photo actuelle</label>
      <img [src]="shop!.photoUrl" [alt]="shop!.name" class="current-photo-img" />
    </div>

    <div class="image-upload-section">
      <label class="section-label">{{ selectedFile ? 'Aperçu de la nouvelle photo' : 'Télécharger une nouvelle photo' }}</label>
      
      <div class="image-upload-container" *ngIf="!imagePreview || (!selectedFile && !shop?.photoUrl)">
        <input 
          type="file" 
          #fileInput
          accept="image/*" 
          (change)="onImageSelected($event)"
          style="display: none" />
        <button 
          mat-stroked-button 
          type="button" 
          class="upload-button"
          (click)="fileInput.click()">
          <mat-icon>add_photo_alternate</mat-icon>
          <span>Choisir une photo</span>
        </button>
        <p class="upload-hint">PNG, JPG, WEBP (Max 5 Mo)</p>
      </div>

      <div class="image-preview-container" *ngIf="imagePreview">
        <img [src]="imagePreview" alt="Photo preview" class="image-preview" />
        <div class="preview-actions">
          <button 
            mat-stroked-button 
            type="button" 
            (click)="fileInput.click()">
            <mat-icon>swap_horiz</mat-icon>
            <span>Changer la photo</span>
          </button>
          <button 
            mat-stroked-button 
            type="button" 
            color="warn"
            (click)="removeImage()"
            *ngIf="selectedFile">
            <mat-icon>close</mat-icon>
            <span>Annuler</span>
          </button>
        </div>
        <input 
          type="file" 
          #fileInput
          accept="image/*" 
          (change)="onImageSelected($event)"
          style="display: none" />
      </div>
    </div>

    <div class="form-error" *ngIf="error">{{ error }}</div>

    <div class="modal-actions">
      <button mat-stroked-button type="button" (click)="onClose()">Annuler</button>
      <button 
        mat-raised-button 
        color="primary" 
        type="button" 
        [disabled]="!selectedFile || isSubmitting"
        (click)="onSubmit()">
        {{ isSubmitting ? 'Mise à jour…' : 'Mettre à jour la photo' }}
      </button>
    </div>
  </div>
</app-modal-forms>
