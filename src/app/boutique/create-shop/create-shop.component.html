<section class="create-shop-page">
	<div class="header">
		<h1>Créez votre boutique</h1>
		<p class="subtitle">Ajoutez les informations principales pour commencer.</p>
	</div>

	<form class="form-card" [formGroup]="form" (ngSubmit)="submit()">
		<mat-form-field appearance="fill" class="full-width">
			<mat-label>Nom de la boutique</mat-label>
			<input matInput formControlName="name" placeholder="Ex: Atelier Lune" />
            <mat-icon matPrefix>storefront</mat-icon>
            
			<mat-error *ngIf="form.controls.name?.hasError('required')">
				Le nom de la boutique est requis
			</mat-error>
			<mat-error *ngIf="form.controls.name?.hasError('minlength')">
				Minimum 2 caractères
			</mat-error>
		</mat-form-field>

		<div class="image-upload-section">
			<label class="image-upload-label">Photo de la boutique</label>
			<div class="image-upload-container" *ngIf="!imagePreview">
				<input type="file" #fileInput accept="image/*" (change)="onImageSelected($event)" style="display: none" />
				<button mat-stroked-button type="button" class="upload-button" (click)="fileInput.click()">
					<mat-icon>add_photo_alternate</mat-icon>
					<span>Choisir une image</span>
				</button>
				<p class="upload-hint">PNG, JPG, WEBP (Max 5MB)</p>
				<p class="state error" *ngIf="imageError">{{ imageError }}</p>
			</div>
			<div class="image-preview-container" *ngIf="imagePreview">
				<img [src]="imagePreview" alt="Shop preview" class="image-preview" />
				<button mat-icon-button type="button" class="remove-image-button" (click)="removeImage()">
					<mat-icon>close</mat-icon>
				</button>
			</div>
		</div>

		<div class="actions">
			<button mat-stroked-button type="button" routerLink="/boutique/my-shop">
				Annuler
			</button>
			<button mat-raised-button color="primary" type="submit" [disabled]="isSubmitting">
				<mat-icon>storefront</mat-icon>
				Créer
			</button>
		</div>

		<div *ngIf="submitError" class="state error">
			<mat-icon>error</mat-icon>
			{{ submitError }}
		</div>
	</form>
</section>
