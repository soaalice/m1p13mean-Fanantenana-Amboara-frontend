<main class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>
        <h1>Connexion</h1>
        <p class="mat-small">Bienvenue ! Entrez vos identifiants pour accéder à votre compte.</p>
        <p class="auth-error" *ngIf="errorMessage">{{ errorMessage }}</p>
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="fill">
          <mat-label>Login</mat-label>
          <input matInput id="login" formControlName="login" required autocomplete="email" />
          <mat-icon matPrefix>person</mat-icon>
          <mat-error *ngIf="loginForm.get('login')?.hasError('required')">
            Le login est requis
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Mot de passe</mat-label>
          <input matInput id="password" type="password" formControlName="password" required autocomplete="current-password" />
          <mat-icon matPrefix>lock</mat-icon>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            Le mot de passe est requis
          </mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid">
          Se connecter
        </button>

        <div class="auth-links">
          <span>Pas encore de compte ?</span>
          <a routerLink="/register">Créer un compte</a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</main>
