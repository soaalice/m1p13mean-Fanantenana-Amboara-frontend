<app-modal-forms [isOpen]="isOpen" title="Ajouter un utilisateur" (close)="onClose()">
	<form [formGroup]="form" (ngSubmit)="onSubmit()">
		<div class="form-grid">
			<label>
				Nom complet
				<input type="text" formControlName="fullName" placeholder="Jane Doe" />
			</label>
			<label>
				Identifiant
				<input type="text" formControlName="login" placeholder="janedoe" />
			</label>
			<label>
				Email
				<input type="email" formControlName="email" placeholder="jane.doe@example.com" />
			</label>
			<label>
				Mot de passe
				<input type="password" formControlName="password" placeholder="******" />
			</label>
			<label>
				Téléphone
				<input type="text" formControlName="tel" placeholder="+221 77 000 00 00" />
			</label>
			<label>
				Rôle
				<select formControlName="role">
					<option *ngFor="let role of roles" [value]="role">{{ role }}</option>
				</select>
			</label>
		</div>

		<div class="form-error" *ngIf="error">{{ error }}</div>

		<div class="modal-actions">
			<button mat-stroked-button color="primary" type="button" class="ghost" (click)="onClose()">Annuler</button>
			<button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || isSubmitting">
				{{ isSubmitting ? 'Création...' : 'Créer' }}
			</button>
		</div>
	</form>
</app-modal-forms>
