<app-modal-forms [isOpen]="isOpen" title="Changer le statut" (close)="onClose()">
	<form [formGroup]="form" (ngSubmit)="onSubmit()">
		<div class="form-grid">
			<label>
				Utilisateur
				<input type="text" [value]="selectedUser?.profile?.fullName || selectedUser?.login || ''" disabled />
			</label>
			<label>
				Statut
				<select formControlName="status">
					<option *ngFor="let status of statusOptions" [value]="status">{{ status }}</option>
				</select>
			</label>
		</div>

		<div class="form-error" *ngIf="error">{{ error }}</div>

		<div class="modal-actions">
			<button mat-stroked-button color="primary" type="button" class="ghost" (click)="onClose()">Annuler</button>
			<button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || isSubmitting">
				{{ isSubmitting ? 'Mise à jour...' : 'Mettre à jour' }}
			</button>
		</div>
	</form>
</app-modal-forms>
