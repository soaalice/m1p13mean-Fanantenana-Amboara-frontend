<app-modal-forms [isOpen]="isOpen" title="Assignate box" (close)="onClose()">
	<div class="assign-fields form-grid">
		<label>
			Rent
			<input
				type="number"
				min="0"
				[ngModel]="assignRent"
				(ngModelChange)="onAssignRentChange($event)"
				[ngModelOptions]="{ standalone: true }"
				placeholder="0" />
		</label>
		<label>
			Start date
			<input
				type="date"
				[ngModel]="assignStartDate"
				(ngModelChange)="onAssignStartDateChange($event)"
				[ngModelOptions]="{ standalone: true }" />
		</label>
	</div>

	<div class="state" *ngIf="boxesLoading">Loading boxes...</div>
	<div class="state error" *ngIf="!boxesLoading && boxesLoadError">{{ boxesLoadError }}</div>

	<div class="table-wrap" *ngIf="!boxesLoading && !boxesLoadError">
		<table mat-table [dataSource]="availableBoxes" class="boxes-table">
			<ng-container matColumnDef="select">
				<th mat-header-cell *matHeaderCellDef></th>
				<td mat-cell *matCellDef="let box">
					<input
						type="radio"
						name="boxSelect"
						[value]="box._id"
						[ngModel]="selectedBoxId"
						(ngModelChange)="onSelectedBoxIdChange($event)"
						[ngModelOptions]="{ standalone: true }"
						(click)="$event.stopPropagation()" />
				</td>
			</ng-container>

			<ng-container matColumnDef="label">
				<th mat-header-cell *matHeaderCellDef>Label</th>
				<td mat-cell *matCellDef="let box">{{ box.label }}</td>
			</ng-container>

			<ng-container matColumnDef="state">
				<th mat-header-cell *matHeaderCellDef>State</th>
				<td mat-cell *matCellDef="let box">
					<span [class]="getStateClass(box.state)">{{ box.state || 'UNKNOWN' }}</span>
				</td>
			</ng-container>

			<tr mat-header-row *matHeaderRowDef="boxesDisplayedColumns"></tr>
			<tr
				mat-row
				*matRowDef="let row; columns: boxesDisplayedColumns"
				class="selectable-row"
				[class.is-selected]="row._id === selectedBoxId"
				(click)="onSelectBox(row)">
			</tr>
		</table>

		<div class="empty" *ngIf="availableBoxes.length === 0">No available boxes.</div>

		<mat-paginator
			class="paginator"
			[length]="boxesTotal"
			[pageIndex]="boxesPage - 1"
			[pageSize]="boxesLimit"
			[pageSizeOptions]="boxesPageSizeOptions"
			(page)="onBoxesPageChange($event)">
		</mat-paginator>
	</div>

	<div class="form-error" *ngIf="assignError">{{ assignError }}</div>

	<div class="modal-actions">
		<button mat-stroked-button color="primary" type="button" class="ghost" (click)="onClose()">
			Cancel
		</button>
		<button
			mat-raised-button
			color="primary"
			type="button"
			[disabled]="!selectedBoxId || isSubmitting"
			(click)="onSubmit()">
			{{ isSubmitting ? 'Assigning...' : 'Assignate' }}
		</button>
	</div>
</app-modal-forms>
