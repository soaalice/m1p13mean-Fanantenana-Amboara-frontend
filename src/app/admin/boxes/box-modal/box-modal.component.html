<app-modal-forms [isOpen]="isOpen" [title]="isEditMode ? 'Modifier la box' : 'Ajouter une box'" (close)="onClose()">
	<form [formGroup]="form" (ngSubmit)="onSubmit()">
		<div class="form-grid">
			<label>
				Libellé
				<input type="text" formControlName="label" placeholder="Box A1" />
			</label>
		</div>

		<div class="form-error" *ngIf="error">{{ error }}</div>

		<div class="modal-actions">
			<button mat-stroked-button color="primary" type="button" class="ghost" (click)="onClose()">Annuler</button>
			<button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || isSubmitting">
				{{ isSubmitting ? (isEditMode ? 'Mise à jour...' : 'Création...') : (isEditMode ? 'Mettre à jour' : 'Créer') }}
			</button>
		</div>
	</form>
</app-modal-forms>
