<section class="boxes-page">
	<div class="header">
		<div class="header-main">
			<div>
				<h1>Boxes</h1>
				<p class="subtitle">Manage your boxes and their status</p>
			</div>
			<div class="actions">
				<button mat-stroked-button type="button" (click)="fetchData()">Refresh</button>
				<button mat-raised-button color="primary" type="button" (click)="openBoxModal()">Add Box</button>
			</div>
		</div>
	</div>

	<div class="state" *ngIf="isLoading">Loading boxes...</div>
	<div class="state error" *ngIf="!isLoading && loadError">{{ loadError }}</div>

	<div class="table-wrap" *ngIf="!isLoading && !loadError">
		<table mat-table [dataSource]="boxes" class="boxes-table">
			<ng-container matColumnDef="label">
				<th mat-header-cell *matHeaderCellDef>Label</th>
				<td mat-cell *matCellDef="let box">{{ box.label }}</td>
			</ng-container>

			<ng-container matColumnDef="state">
				<th mat-header-cell *matHeaderCellDef>State</th>
				<td mat-cell *matCellDef="let box">
					<span [class]="getStateClass(box.state)">{{ box.state || 'UNKNOWN' }}</span>
				</td>
			</ng-container>

			<ng-container matColumnDef="rent">
				<th mat-header-cell *matHeaderCellDef>Rent</th>
				<td mat-cell *matCellDef="let box">{{ box.rent }} MGA</td>
			</ng-container>

			<ng-container matColumnDef="actions">
				<th mat-header-cell *matHeaderCellDef></th>
				<td mat-cell *matCellDef="let box">
					<button mat-icon-button [matMenuTriggerFor]="menu">
						<mat-icon>more_vert</mat-icon>
					</button>
					<mat-menu #menu="matMenu">
						<button mat-menu-item (click)="onEdit(box)">
							<mat-icon>edit</mat-icon>
							<span>Edit</span>
						</button>
						<button mat-menu-item (click)="onDelete(box)">
							<mat-icon>delete</mat-icon>
							<span>Delete</span>
						</button>
					</mat-menu>
				</td>
			</ng-container>

			<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
			<tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
		</table>

		<div class="empty" *ngIf="boxes.length === 0">No boxes found.</div>

		<mat-paginator
			class="paginator"
			[length]="total"
			[pageIndex]="page - 1"
			[pageSize]="limit"
			[pageSizeOptions]="pageSizeOptions"
			(page)="onPageChange($event)">
		</mat-paginator>
	</div>
</section>

<app-modal-forms [isOpen]="isModalOpen" [title]="isEditMode ? 'Edit box' : 'Add box'" (close)="closeBoxModal()">
	<form [formGroup]="boxForm" (ngSubmit)="submitBox()">
		<div class="form-grid">
			<label>
				Label
				<input type="text" formControlName="label" placeholder="Box A1" />
			</label>
			<label>
				State
				<select formControlName="state">
					<option *ngFor="let state of stateOptions" [value]="state">{{ state }}</option>
				</select>
			</label>
			<label>
				Rent (MGA)
				<input type="number" formControlName="rent" min="0" placeholder="0" />
			</label>
		</div>

		<div class="form-error" *ngIf="submitError">{{ submitError }}</div>

		<div class="modal-actions">
			<button mat-stroked-button color="primary" type="button" class="ghost" (click)="closeBoxModal()">Cancel</button>
			<button mat-raised-button color="primary" type="submit" [disabled]="boxForm.invalid || isSubmitting">
				{{ isSubmitting ? (isEditMode ? 'Updating...' : 'Creating...') : (isEditMode ? 'Update' : 'Create') }}
			</button>
		</div>
	</form>
</app-modal-forms>
