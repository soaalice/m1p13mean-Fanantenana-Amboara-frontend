<section class="boxes-page">
	<div class="header">
		<div class="header-main">
			<div>
				<h1>Boxes</h1>
				<p class="subtitle">Gérez vos boxes et leur statut</p>
			</div>
			<div class="actions">
				<button mat-stroked-button type="button" (click)="fetchData()">Actualiser</button>
				<button mat-raised-button color="primary" type="button" (click)="openBoxModal()">Ajouter une box</button>
			</div>
		</div>
	</div>

	<app-loader *ngIf="isLoading" message="Chargement des boxes…" [inline]="true"></app-loader>
	<div class="state error" *ngIf="!isLoading && loadError">{{ loadError }}</div>

	<div class="table-wrap" *ngIf="!isLoading && !loadError">
		<table mat-table [dataSource]="boxes" class="boxes-table">
			<ng-container matColumnDef="label">
				<th mat-header-cell *matHeaderCellDef>Libellé</th>
				<td mat-cell *matCellDef="let box">{{ box.label }}</td>
			</ng-container>

			<ng-container matColumnDef="state">
				<th mat-header-cell *matHeaderCellDef>État</th>
				<td mat-cell *matCellDef="let box">
					<span [class]="getStateClass(box.state)">{{ box.state || 'UNKNOWN' }}</span>
				</td>
			</ng-container>

			<ng-container matColumnDef="rent">
				<th mat-header-cell *matHeaderCellDef>Loyer</th>
				<td mat-cell *matCellDef="let box">{{ box.rent }} MGA</td>
			</ng-container>

			<ng-container matColumnDef="actions">
				<th mat-header-cell *matHeaderCellDef></th>
				<td mat-cell *matCellDef="let box">
					<button mat-icon-button [matMenuTriggerFor]="menu">
						<mat-icon>more_vert</mat-icon>
					</button>
					<mat-menu #menu="matMenu">
						<button mat-menu-item (click)="onEdit(box)">
							<mat-icon>edit</mat-icon>
						<span>Modifier</span>
					</button>
					<button mat-menu-item (click)="onDelete(box)">
						<mat-icon>delete</mat-icon>
						<span>Supprimer</span>
						</button>
					</mat-menu>
				</td>
			</ng-container>

			<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
			<tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
		</table>

		<div class="empty" *ngIf="boxes.length === 0">Aucune box trouvée.</div>

		<mat-paginator
			class="paginator"
			[length]="total"
			[pageIndex]="page - 1"
			[pageSize]="limit"
			[pageSizeOptions]="pageSizeOptions"
			(page)="onPageChange($event)">
		</mat-paginator>
	</div>
</section>

<app-box-modal
	[isOpen]="isModalOpen"
	[isEditMode]="isEditMode"
	[isSubmitting]="isSubmitting"
	[error]="submitError"
	[form]="boxForm"
	(close)="closeBoxModal()"
	(submit)="submitBox()"
></app-box-modal>
