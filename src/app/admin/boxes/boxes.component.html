<section class="boxes-page">
  <!-- Header -->
  <div class="header">
    <div>
      <h1>Boxes</h1>
      <p class="subtitle">Manage your boxes and their status</p>
    </div>
    <button class="refresh" type="button" (click)="loadBoxes()">Refresh</button>
  </div>

  <!-- Loading / Error states -->
  <div class="state" *ngIf="isLoading">Loading boxes...</div>
  <!-- <div class="state error" *ngIf="!isLoading && loadError">{{ loadError }}</div> -->

  <!-- Table -->
  <div class="table-wrap" *ngIf="!isLoading && !loadError">
    <table mat-table [dataSource]="boxes" class="mat-elevation-z2" style="width:100%">
      
      <!-- Label -->
      <ng-container matColumnDef="label">
        <th mat-header-cell *matHeaderCellDef> Label </th>
        <td mat-cell *matCellDef="let box"> {{ box.label }} </td>
      </ng-container>

      <!-- State -->
      <ng-container matColumnDef="state">
        <th mat-header-cell *matHeaderCellDef> État </th>
        <td mat-cell *matCellDef="let box">
          <span [ngClass]="{
            'available': box.state === 'AVAILABLE',
            'rented': box.state === 'RENTED',
            'repair': box.state === 'REPAIR'
          }">{{ box.state }}</span>
        </td>
      </ng-container>

      <!-- Rent -->
      <ng-container matColumnDef="rent">
        <th mat-header-cell *matHeaderCellDef> Loyer </th>
        <td mat-cell *matCellDef="let box"> {{ box.rent }} € </td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let box">
          <button mat-icon-button [matMenuTriggerFor]="menu">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="onEdit(box)">
              <mat-icon>edit</mat-icon>
              <span>Modifier</span>
            </button>
            <button mat-menu-item (click)="onDelete(box)">
              <mat-icon>delete</mat-icon>
              <span>Supprimer</span>
            </button>
          </mat-menu>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <!-- Pagination -->
    <mat-paginator [length]="totalItems"
                   [pageSize]="pageSize"
                   [pageIndex]="pageIndex"
                   [pageSizeOptions]="[5, 10, 20]"
                   (page)="onPageChange($event)">
    </mat-paginator>
  </div>
</section>
