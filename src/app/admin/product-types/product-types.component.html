<section class="product-types-page">
    <div class="header">
        <div class="header-main">
            <div>
                <h1>Product types</h1>
                <p class="subtitle">Manage product types</p>
            </div>
            <div class="actions">
                <button mat-stroked-button type="button" (click)="fetchData()">Refresh</button>
                <button mat-raised-button color="primary" type="button" (click)="openProductTypeModal()">Add Product Type</button>
            </div>
        </div>
    </div>

    <div class="state" *ngIf="isLoading">Loading product types...</div>
    <div class="state error" *ngIf="!isLoading && loadError">{{ loadError }}</div>

    <div class="table-wrap" *ngIf="!isLoading && !loadError">
        <table mat-table [dataSource]="productTypes" class="product-types-table">
            <ng-container matColumnDef="label">
                <th mat-header-cell *matHeaderCellDef>Label</th>
                <td mat-cell *matCellDef="let productType">{{ productType.label }}</td>
            </ng-container>

            <ng-container matColumnDef="attributes">
                <th mat-header-cell *matHeaderCellDef>Attributes</th>
                <td mat-cell *matCellDef="let productType" class="attributes-cell">
                    {{ formatAttributes(productType) }}
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let productType">
                    <button mat-icon-button [matMenuTriggerFor]="menu">
                        <mat-icon>more_vert</mat-icon>
                    </button>
                    <mat-menu #menu="matMenu">
                        <button mat-menu-item (click)="onEdit(productType)">
                            <mat-icon>edit</mat-icon>
                            <span>Edit</span>
                        </button>
                        <button mat-menu-item (click)="onDelete(productType)">
                            <mat-icon>delete</mat-icon>
                            <span>Delete</span>
                        </button>
                    </mat-menu>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>

        <div class="empty" *ngIf="productTypes.length === 0">No product types available.</div>

        <mat-paginator
            class="paginator"
            [length]="total"
            [pageIndex]="page - 1"
            [pageSize]="limit"
            [pageSizeOptions]="pageSizeOptions"
            (page)="onPageChange($event)">
        </mat-paginator>
    </div>
</section>

<app-modal-forms [isOpen]="isModalOpen" [title]="isEditMode ? 'Edit product type' : 'Add product type'" (close)="closeProductTypeModal()">
    <form class="product-type-modal" [formGroup]="productTypeForm" (ngSubmit)="onSubmit()">
        <div class="form-grid">
            <label>
                Id
                <input type="text" formControlName="_id" placeholder="PT-001" [disabled]="isEditMode" />
                <span class="field-error" *ngIf="productTypeForm.get('_id')?.hasError('required')">Id is required</span>
            </label>

            <label>
                Label
                <input type="text" formControlName="label" placeholder="Fresh vegetables" />
                <span class="field-error" *ngIf="productTypeForm.get('label')?.hasError('required')">Label is required</span>
            </label>
        </div>

        <div class="attributes-header">
            <h3>Attributes</h3>
            <button mat-stroked-button type="button" (click)="addAttribute()">Add attribute</button>
        </div>

        <div class="attribute-list" formArrayName="attributes">
            <div class="attribute-card" *ngFor="let attribute of attributes.controls; let i = index" [formGroupName]="i">
                <div class="attribute-grid">
                    <label>
                        Code
                        <input type="text" formControlName="code" placeholder="COLOR" />
                        <span class="field-error" *ngIf="attribute.get('code')?.hasError('required')">Code is required</span>
                    </label>

                    <label>
                        Type
                        <select formControlName="type">
                            <option *ngFor="let type of attributeTypes" [value]="type">{{ type }}</option>
                        </select>
                        <span class="field-error" *ngIf="attribute.get('type')?.hasError('required')">Type is required</span>
                    </label>

                    <label class="attribute-wide" *ngIf="attribute.get('type')?.value === 'ENUM'">
                        Values (comma separated)
                        <textarea rows="2" formControlName="valuesText" placeholder="RED, GREEN, BLUE"></textarea>
                        <span class="field-error" *ngIf="attribute.get('valuesText')?.hasError('required')">Values are required for ENUM</span>
                    </label>

                    <label *ngIf="attribute.get('type')?.value === 'NUMBER'">
                        Min
                        <input type="number" formControlName="min" placeholder="0" />
                        <span class="field-error" *ngIf="attribute.get('min')?.hasError('required')">Min is required for NUMBER</span>
                    </label>

                    <label *ngIf="attribute.get('type')?.value === 'NUMBER'">
                        Max
                        <input type="number" formControlName="max" placeholder="100" />
                        <span class="field-error" *ngIf="attribute.get('max')?.hasError('required')">Max is required for NUMBER</span>
                    </label>
                </div>

                <button mat-stroked-button color="primary" type="button" class="remove-attr" (click)="removeAttribute(i)">
                    Remove
                </button>
            </div>
        </div>

        <div class="form-error" *ngIf="submitError">{{ submitError }}</div>

        <div class="modal-actions">
            <button mat-stroked-button color="primary" type="button" class="ghost" (click)="closeProductTypeModal()">Cancel</button>
            <button mat-raised-button color="primary" type="submit" [disabled]="productTypeForm.invalid || isSubmitting">
                {{ isSubmitting ? (isEditMode ? 'Updating...' : 'Creating...') : (isEditMode ? 'Update' : 'Create') }}
            </button>
        </div>
    </form>
</app-modal-forms>
