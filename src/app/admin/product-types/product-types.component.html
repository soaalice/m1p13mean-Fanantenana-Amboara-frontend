<section class="product-types-page">
    <div class="header">
        <div class="header-main">
            <div>
                <h1>Product types</h1>
                <p class="subtitle">Manage product types</p>
            </div>
            <div class="actions">
                <button mat-stroked-button type="button" (click)="fetchData()">Refresh</button>
                <button mat-raised-button color="primary" type="button" (click)="openProductTypeModal()">Add Product Type</button>
            </div>
        </div>
    </div>

    <app-loader *ngIf="isLoading" message="Loading product types…" [inline]="true"></app-loader>
    <div class="state error" *ngIf="!isLoading && loadError">{{ loadError }}</div>

    <div class="table-wrap" *ngIf="!isLoading && !loadError">
        <table mat-table [dataSource]="productTypes" class="product-types-table">
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef>ID</th>
                <td mat-cell *matCellDef="let productType">{{ productType._id }}</td>
            </ng-container>

            <ng-container matColumnDef="label">
                <th mat-header-cell *matHeaderCellDef>Label</th>
                <td mat-cell *matCellDef="let productType">{{ productType.label }}</td>
            </ng-container>

            <ng-container matColumnDef="attributes">
                <th mat-header-cell *matHeaderCellDef>Attributes</th>
                <td mat-cell *matCellDef="let productType" class="attributes-cell">
                    <div class="attributes-badges">
                        <span
                            class="attribute-badge"
                            *ngFor="let badge of getAttributeBadges(productType)"
                            [class.badge-enum]="badge.type === 'ENUM'"
                            [class.badge-number]="badge.type === 'NUMBER'"
                            [class.badge-string]="badge.type === 'STRING'"
                            [class.badge-boolean]="badge.type === 'BOOLEAN'"
                            [class.badge-date]="badge.type === 'DATE'"
                            [class.badge-empty]="badge.type === 'NONE'">
                            {{ badge.label }}
                        </span>
                    </div>
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let productType">
                    <button mat-icon-button [matMenuTriggerFor]="menu">
                        <mat-icon>more_vert</mat-icon>
                    </button>
                    <mat-menu #menu="matMenu">
                        <button mat-menu-item (click)="onEdit(productType)">
                            <mat-icon>edit</mat-icon>
                            <span>Edit</span>
                        </button>
                        <button mat-menu-item (click)="onDelete(productType)">
                            <mat-icon>delete</mat-icon>
                            <span>Delete</span>
                        </button>
                    </mat-menu>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>

        <div class="empty" *ngIf="productTypes.length === 0">No product types available.</div>

        <mat-paginator
            class="paginator"
            [length]="total"
            [pageIndex]="page - 1"
            [pageSize]="limit"
            [pageSizeOptions]="pageSizeOptions"
            (page)="onPageChange($event)">
        </mat-paginator>
    </div>
</section>

<app-product-type-modal
    [isOpen]="isModalOpen"
    [isEditMode]="isEditMode"
    [isSubmitting]="isSubmitting"
    [submitError]="submitError"
    [attributeTypes]="attributeTypes"
    [form]="productTypeForm"
    [attributes]="attributes"
    (close)="closeProductTypeModal()"
    (submit)="onSubmit()"
    (addAttribute)="addAttribute()"
    (removeAttribute)="removeAttribute($event)">
</app-product-type-modal>
