<section class="transactions-calendar-page">

	<div class="page-header">
		<div>
			<h1>Calendrier des Loyers</h1>
			<p class="subtitle">Visualisez les transactions LOYER par mois, semaine ou année.</p>
		</div>
		<button mat-stroked-button type="button" (click)="loadTransactions()">
			Actualiser
		</button>
	</div>

	<app-loader *ngIf="isLoading" message="Chargement des transactions LOYER…" [inline]="true"></app-loader>

	<div *ngIf="loadError && !isLoading" class="state error">
		<mat-icon>error</mat-icon>
		{{ loadError }}
	</div>

	<mat-card class="calendar-card">

		<div class="legend">
			<span *ngFor="let item of legend" class="legend-item">
				<span class="legend-dot" [style.background]="item.border"></span>
				{{ item.label }}
			</span>
		</div>

		<full-calendar [options]="calendarOptions"></full-calendar>
	</mat-card>

</section>
