<div class="sidebar-wrap">

  <!-- ── Brand ── -->
  <div class="sidebar-brand">
    <mat-icon class="brand-icon">storefront</mat-icon>
    <span class="brand-text">MEAN APP</span>
  </div>

  <!-- ── User profile ── -->
  <div class="sidebar-profile">
    <div class="avatar" aria-hidden="true">{{ userInitial }}</div>
    <div class="profile-info">
      <span class="profile-name">{{ userName }}</span>
      <span class="profile-role">{{ userRoleLabel }}</span>
    </div>
  </div>

  <div class="sidebar-divider"></div>

  <!-- ── Navigation ── -->
  <nav class="sidebar-nav" role="navigation" aria-label="Menu principal">
    <a
      *ngFor="let item of menuItems"
      class="nav-item"
      [routerLink]="item.route"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: !!item.exact }"
      [ariaCurrentWhenActive]="'page'"
      (click)="onNavItemClick()"
    >
      <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
      <span class="nav-label">{{ item.label }}</span>
    </a>
  </nav>

  <div class="sidebar-spacer"></div>

  <div class="sidebar-divider"></div>

  <!-- ── Logout ── -->
  <div class="sidebar-footer">
    <button class="logout-btn" matRipple (click)="logout()" type="button">
      <mat-icon>logout</mat-icon>
      <span>Déconnexion</span>
    </button>
  </div>

</div>
