<section class="error-page">
	<div class="error-orb orb-1"></div>
	<div class="error-orb orb-2"></div>
	<div class="error-grid"></div>

	<div class="error-card">
		<div class="error-code">
			<span class="code">{{ status || 404 }}</span>
			<span class="label">Erreur</span>
		</div>

		<h1>Nous avons rencontré un problème.</h1>
		<p class="message">{{ message }}</p>
		<p class="hint">Essayez une autre route ou retournez à la page d'accueil.</p>

		<!-- 404 : retour à la page précédente uniquement -->
		<div class="error-actions" *ngIf="status === 404">
			<button class="btn primary" (click)="goBack()">Retour</button>
		</div>

		<!-- 403 : retour précédent + login -->
		<div class="error-actions" *ngIf="status === 403">
			<button class="btn ghost" (click)="goBack()">Retour</button>
			<button class="btn primary" (click)="goToLogin()">Retour au login</button>
		</div>
	</div>
</section>
