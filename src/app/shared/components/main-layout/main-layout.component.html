<mat-drawer-container class="layout-container" autosize>

  <mat-drawer
    #drawer
    class="layout-sidenav"
    [mode]="drawerMode"
    [opened]="drawerOpened"
  >
    <app-sidebar></app-sidebar>
  </mat-drawer>

  <mat-drawer-content class="layout-content">

    <mat-toolbar
      class="layout-toolbar"
      [class.layout-toolbar--acheteur]="isAcheteur && !isMobile"
    >
      <!-- Hamburger : admin/boutique toujours | acheteur mobile seulement -->
      <button
        *ngIf="!isAcheteur || isMobile"
        mat-icon-button
        class="menu-toggle-btn"
        (click)="toggleSidebar()"
        aria-label="Ouvrir le menu"
        matTooltip="Menu"
      >
        <mat-icon>menu</mat-icon>
      </button>

      <div *ngIf="isAcheteur" class="toolbar-brand">
        <mat-icon class="brand-icon">storefront</mat-icon>
        <span class="brand-name">MEAN APP</span>
      </div>

      <!-- Nav inline : acheteur desktop / tablet uniquement -->
      <nav *ngIf="isAcheteur && !isMobile" class="toolbar-acheteur-nav" aria-label="Navigation acheteur">
        <a
          *ngFor="let item of acheteurNavItems"
          class="toolbar-nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      </nav>

      <span class="spacer"></span>

      <!-- Déconnexion : acheteur uniquement dans la toolbar -->
      <button
        *ngIf="isAcheteur && !isMobile"
        mat-icon-button
        matTooltip="Déconnexion"
        aria-label="Déconnexion"
        (click)="logout()"
      >
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="main-content" [class.main-content--acheteur]="isAcheteur && isMobile">
      <router-outlet></router-outlet>
    </main>

    <app-footer></app-footer>

    <!-- Cart FAB: visible on all acheteur pages -->
    <button
      *ngIf="isAcheteur"
      class="cart-fab"
      (click)="openCart()"
      aria-label="Voir le panier"
    >
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 18C5.9 18 5.01 18.9 5.01 20S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2zM7.17 14.75L7.2 14.63l.9-1.63H15.55c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21L4.27 2H1v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96C5 16.1 5.9 17 7 17h12v-2H7.42c-.14 0-.25-.11-.25-.25z" fill="currentColor"/>
      </svg>
      <span class="cart-badge" *ngIf="(cartCount$ | async) as count">{{ count }}</span>
    </button>

    <app-cart-modal *ngIf="cartOpen" (close)="cartOpen = false"></app-cart-modal>

  </mat-drawer-content>
</mat-drawer-container>
