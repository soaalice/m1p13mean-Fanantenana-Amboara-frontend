<section class="transactions-page">
	<div class="header">
		<div class="header-main">
			<div>
				<h1>Transactions</h1>
				<p class="subtitle">History of your account activity</p>
			</div>
			<div class="actions">
				<button mat-stroked-button type="button" (click)="applyFilters()">Refresh</button>
			</div>
		</div>

		<app-list-filters [showApply]="false" (reset)="resetFilters()">
			<label class="filter-item">
				<span>Type</span>
				<select [(ngModel)]="filterType">
					<option *ngFor="let type of typeOptions" [value]="type">{{ type || 'All' }}</option>
				</select>
			</label>
			<label class="filter-item">
				<span>Start date</span>
				<input type="date" [(ngModel)]="startDate" />
			</label>
			<label class="filter-item">
				<span>End date</span>
				<input type="date" [(ngModel)]="endDate" />
			</label>
		</app-list-filters>
	</div>

	<div class="state" *ngIf="isLoading">Loading transactions...</div>
	<div class="state error" *ngIf="!isLoading && loadError">{{ loadError }}</div>

	<div class="table-wrap" *ngIf="!isLoading && !loadError">
		<table mat-table [dataSource]="transactions" class="transactions-table" [trackBy]="trackById">
			<ng-container matColumnDef="type">
				<th mat-header-cell *matHeaderCellDef>Type</th>
				<td mat-cell *matCellDef="let transaction">{{ transaction.type || '-' }}</td>
			</ng-container>

			<ng-container matColumnDef="amount">
				<th mat-header-cell *matHeaderCellDef>Amount</th>
				<td mat-cell *matCellDef="let transaction">
					{{ transaction.total | number:'1.0-2' }}
				</td>
			</ng-container>

			<ng-container matColumnDef="date">
				<th mat-header-cell *matHeaderCellDef>Date</th>
				<td mat-cell *matCellDef="let transaction">
					{{ transaction.date | date:'medium' }}
				</td>
			</ng-container>

			<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
			<tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
		</table>

		<div class="empty" *ngIf="transactions.length === 0">No transactions found.</div>

		<mat-paginator
			class="paginator"
			[length]="total"
			[pageIndex]="page - 1"
			[pageSize]="limit"
			[pageSizeOptions]="pageSizeOptions"
			(page)="onPageChange($event)">
		</mat-paginator>
	</div>
</section>
