<div class="products-page">
  <header class="page-header">
    <h1 class="page-title">Discover Our Products</h1>
    <p class="page-subtitle">Explore our curated collection of premium products</p>
  </header>

  <div class="products-grid">
    <app-product-card 
      *ngFor="let product of products" 
      [product]="product"
      [imageUrl]="product.imageUrl">
    </app-product-card>
  </div>

  <!-- Floating Cart Button -->
  <button class="cart-fab" (click)="openCart()" aria-label="Voir le panier">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M7 18C5.9 18 5.01 18.9 5.01 20S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2zM7.17 14.75L7.2 14.63l.9-1.63H15.55c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21L4.27 2H1v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96C5 16.1 5.9 17 7 17h12v-2H7.42c-.14 0-.25-.11-.25-.25z" fill="currentColor"/>
    </svg>
    <span class="cart-badge" *ngIf="(cartCount$ | async) as count">{{ count }}</span>
  </button>

  <app-cart-modal *ngIf="cartOpen" (close)="cartOpen = false"></app-cart-modal>
</div>
